<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hairolozy - Admin Dashboard</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #121212;
            color: #f5f5f5;
            padding: 15px;
        }

        header {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
            margin-bottom: 20px;
        }

        header h1 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            color: #aaa;
            font-size: 14px;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        section {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-left: 4px solid #d4af37;
        }

        section h2 {
            font-size: 18px;
            color: #d4af37;
            margin-bottom: 12px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #d4af37;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            background: #b89728;
        }

        .history-card {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #d4af37;
        }

        .history-card h3 {
            color: #d4af37;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .history-card p {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 2px;
        }

        .services-box {
            height: 120px;
            overflow-y: scroll;
            border: 1px solid #444;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 12px;
            color: #fff;
        }

        .services-box label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .services-box input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Hairolozy v1</h1>
        <p>Hair Science & Client Records</p>
    </header>

    <main>
        <!-- 1. Upcoming Bookings Section -->
        <section id="bookings">
            <h2>Upcoming Bookings</h2>
            <div id="booking-list">
                <p>Abhi koi booking nahi hai.</p>
            </div>
        </section>

        <!-- 2. New Client Record Form -->
        <section id="client-form">
            <h2>New Client Record</h2>
            <input type="text" id="client-name" placeholder="Client ka Naam">
            <input type="tel" id="client-phone" placeholder="Phone Number">
            <textarea id="color-formula" placeholder="Hair Color Formula (e.g., Base 5 + 20vol)"></textarea>
            <button id="save-btn">Record Save Karein</button>
        </section>

        <!-- 3. Nayi Booking / Session Booking Section (Services Checkbox + Date/Time + Specs) -->
        <section id="booking-create">
            <h2>Book Your Hair Session</h2>
            <form id="bookingForm">
                <input type="text" id="book-name" placeholder="Client Name" required>
                <input type="tel" id="book-phone" placeholder="Phone Number" required>
                <input type="date" id="book-date" required>
                
                <select id="book-time" required>
                    <option value="">Select Time Slot</option>
                    <option value="10 AM">10 AM</option>
                    <option value="11 AM">11 AM</option>
                    <option value="12 PM">12 PM</option>
                    <option value="01 PM">01 PM</option>
                    <option value="02 PM">02 PM</option>
                    <option value="03 PM">03 PM</option>
                    <option value="04 PM">04 PM</option>
                    <option value="05 PM">05 PM</option>
                    <option value="06 PM">06 PM</option>
                    <option value="07 PM">07 PM</option>
                    <option value="08 PM">08 PM</option>
                </select>

                <label style="font-size: 13px; color: #d4af37; display: block; margin-bottom: 5px;">Services (Select multiple):</label>
                <div class="services-box">
                    <label><input type="checkbox" name="service" value="Haircut"> Haircut</label>
                    <label><input type="checkbox" name="service" value="Hair Spa"> Hair Spa</label>
                    <label><input type="checkbox" name="service" value="Hair Color"> Hair Color</label>
                    <label><input type="checkbox" name="service" value="Keratin"> Keratin Treatment</label>
                    <label><input type="checkbox" name="service" value="Blow Dry"> Blow Dry</label>
                    <label><input type="checkbox" name="service" value="Styling"> Hair Styling</label>
                    <label><input type="checkbox" name="service" value="Massage"> Head Massage</label>
                    <label><input type="checkbox" name="service" value="Botox"> Hair Botox</label>
                    <label><input type="checkbox" name="service" value="Root Touch"> Root Touch-up</label>
                    <label><input type="checkbox" name="service" value="Highlights"> Highlights</label>
                    <label><input type="checkbox" name="service" value="Texture"> Hair Texture</label>
                </div>

                <textarea id="book-specs" placeholder="Client Specifications"></textarea>
                <button type="submit" id="book-confirm-btn">Confirm Booking</button>
            </form>
        </section>

        <!-- 4. Client History & Formulas Section -->
        <section id="client-history">
            <h2>Client History & Formulas</h2>
            <div id="history-list">
                <p>Loading...</p>
            </div>
        </section>
    </main>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="js/app.js"></script>
</body>
</html>
