<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hairolozy - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Hairolozy v1</h1>
        <p>Hair Science & Client Records</p>
    </header>

    <main>
        <section id="bookings">
            <h2>Upcoming Bookings</h2>
            <div id="booking-list">
                <p>Abhi koi booking nahi hai.</p>
            </div>
        </section>

        <section id="client-form">
            <h2>New Client Record</h2>
            <input type="text" id="client-name" placeholder="Client ka Naam">
            <input type="tel" id="client-phone" placeholder="Phone Number">
            <textarea id="color-formula" placeholder="Hair Color Formula (e.g., Base 5 + 20vol)"></textarea>
            
            <button id="save-btn">Record Save Karein</button>
        </section>

        <section id="client-history">
            <h2>Client History & Formulas</h2>
            <div id="history-list">
                <p>Loading...</p>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
