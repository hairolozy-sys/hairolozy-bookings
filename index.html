<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hairolozy - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Hairolozy v1</h1>
        <p>Hair Science & Client Records</p>
        
        <!-- System Notification Enable Karne Ka Button -->
        <button id="noti-btn" onclick="requestNotificationPermission()" style="margin-top: 10px; padding: 10px 16px; background: #d4af37; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
            🔔 WhatsApp Jaisi Notification On Karein
        </button>
    </header>

    <main>
        <section id="bookings">
            <h2>Upcoming Bookings</h2>
            <div id="booking-list">
                <p>Abhi koi booking nahi hai.</p>
            </div>
        </section>

        <section id="client-form">
            <h2>New Client Record</h2>
            <input type="text" id="client-name" placeholder="Client ka Naam">
            <input type="tel" id="client-phone" placeholder="Phone Number">
            <textarea id="color-formula" placeholder="Hair Color Formula (e.g., Base 5 + 20vol)"></textarea>
            
            <button id="save-btn">Record Save Karein</button>
        </section>

        <section id="client-history">
            <h2>Client History & Formulas</h2>
            <div id="history-list">
                <p>Loading...</p>
            </div>
        </section>
    </main>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Tumhari Main JS File -->
    <script src="js/app.js"></script>

    <!-- Browser System Notification Permission Logic -->
    <script>
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Yeh browser notifications support nahi karta.");
                return;
            }

            Notification.requestPermission().then(function(permission) {
                if (permission === "granted") {
                    alert("Success! Ab aapko WhatsApp jaisi system notifications milengi.");
                    let btn = document.getElementById('noti-btn');
                    btn.innerText = "✅ Notifications Active";
                    btn.style.background = "#27ae60";
                    btn.style.color = "#fff";
                } else {
                    alert("Aapne notification permission deny kar di hai.");
                }
            });
        }
    </script>
</body>
</html>
